services:
  # ----------------------------------------------------------------
  # PostgreSQL with pgvector extension
  # ----------------------------------------------------------------
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: forgeflow
      POSTGRES_USER: forgeflow
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD required — see .env.example}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U forgeflow -d forgeflow"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  # ----------------------------------------------------------------
  # Database migrations (run once, then exits)
  # ----------------------------------------------------------------
  migrate:
    build:
      context: .
      dockerfile: Dockerfile
      target: api
    command: ["sh", "-c", "alembic upgrade head && python -m scripts.provision_runtime_database"]
    environment:
      POSTGRES_SYNC_URL: postgresql+psycopg://forgeflow:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD required — see .env.example}@postgres:5432/forgeflow
      POSTGRES_MIGRATION_URL: postgresql+psycopg://forgeflow:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD required}@postgres:5432/forgeflow
      POSTGRES_RUNTIME_PASSWORD: ${POSTGRES_RUNTIME_PASSWORD:?POSTGRES_RUNTIME_PASSWORD required — use a separate runtime password}
    depends_on:
      postgres:
        condition: service_healthy
    profiles:
      - migration

  # ----------------------------------------------------------------
  # MCP Tool Server
  # ----------------------------------------------------------------
  mcp_server:
    build:
      context: .
      dockerfile: Dockerfile
      target: mcp
    command: python -m forgeflow.mcp.server.main http
    environment:
      TAVILY_API_KEY: ${TAVILY_API_KEY:-}
      POSTGRES_URL: postgresql+asyncpg://forgeflow_runtime:${POSTGRES_RUNTIME_PASSWORD:?POSTGRES_RUNTIME_PASSWORD required}@postgres:5432/forgeflow
      MCP_SERVER_HOST: "0.0.0.0"
      MCP_SERVER_PORT: "8001"
      MCP_SERVICE_SECRET: ${MCP_SERVICE_SECRET:?Separate MCP_SERVICE_SECRET required}
      MCP_TOOL_GRANTS: ${MCP_TOOL_GRANTS:-}
      CONNECTOR_MOCK_ENABLED: ${CONNECTOR_MOCK_ENABLED:-false}
    expose:
      - "8001"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ----------------------------------------------------------------
  # FastAPI Backend
  # ----------------------------------------------------------------
  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: api
    command: uvicorn forgeflow.api.main:app --host 0.0.0.0 --port 8000 --reload
    environment:
      # LLM runs locally on Ollama (OpenAI/Anthropic removed in INC16).
      LLM_PROVIDER: ${LLM_PROVIDER:-ollama}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5vl:3b}
      OLLAMA_MODEL_STRONG: ${OLLAMA_MODEL_STRONG:-qwen2.5vl:3b}
      POSTGRES_URL: postgresql+asyncpg://forgeflow_runtime:${POSTGRES_RUNTIME_PASSWORD:?POSTGRES_RUNTIME_PASSWORD required}@postgres:5432/forgeflow
      POSTGRES_SYNC_URL: postgresql+psycopg://forgeflow_runtime:${POSTGRES_RUNTIME_PASSWORD:?POSTGRES_RUNTIME_PASSWORD required}@postgres:5432/forgeflow
      RESOURCE_STORE_ROOT: /var/lib/forgeflow/resources
      MCP_SERVER_HOST: mcp_server
      MCP_SERVER_PORT: "8001"
      MCP_SERVICE_SECRET: ${MCP_SERVICE_SECRET:?Separate MCP_SERVICE_SECRET required}
      MCP_TOOL_GRANTS: ${MCP_TOOL_GRANTS:-}
      CONNECTOR_MOCK_ENABLED: ${CONNECTOR_MOCK_ENABLED:-false}
      TAVILY_API_KEY: ${TAVILY_API_KEY:-}
      LANGCHAIN_TRACING_V2: ${LANGCHAIN_TRACING_V2:-false}
      LANGCHAIN_API_KEY: ${LANGCHAIN_API_KEY:-}
      LANGCHAIN_PROJECT: ${LANGCHAIN_PROJECT:-forgeflow}
      API_SECRET_KEY: "${API_SECRET_KEY:?API_SECRET_KEY required — generate with: openssl rand -hex 32}"
      DEV_LOGIN_ENABLED: ${DEV_LOGIN_ENABLED:-true}
      DEV_LOGIN_PASSWORD: ${DEV_LOGIN_PASSWORD:?DEV_LOGIN_PASSWORD required when DEV_LOGIN_ENABLED=true}
      DOCS_ENABLED: ${DOCS_ENABLED:-true}
      CORS_ALLOW_ORIGINS: ${CORS_ALLOW_ORIGINS:-http://localhost:5173,http://localhost:8501}
      TRUSTED_PROXY_COUNT: ${TRUSTED_PROXY_COUNT:-0}
      BUDGET_LIMIT_USD: ${BUDGET_LIMIT_USD:-5.0}
    ports:
      - "8000:8000"
    volumes:
      - ./forgeflow:/app/forgeflow:ro  # hot-reload in dev
      - resource_data:/var/lib/forgeflow/resources
    depends_on:
      postgres:
        condition: service_healthy
      mcp_server:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 2G
    restart: unless-stopped

  # ----------------------------------------------------------------
  # React + nginx Console
  # Serves the built SPA on :8501 and reverse-proxies /api → api:8000.
  # Auth is now per-user: the SPA hits /api/auth/login and attaches its
  # own JWT. nginx no longer injects a shared admin secret (C-2 fix).
  # ----------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    environment:
      NGINX_ENVSUBST_TEMPLATE_DIR: /etc/nginx/templates
    ports:
      - "8501:80"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  pgdata:
    name: forgeflow_pgdata
  resource_data:
    name: forgeflow_resource_data
