{{- if not .Values.api.persistence.existingClaim }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Release.Name }}-resources
  labels:
    {{- include "forgeflow.labels" . | nindent 4 }}
spec:
  accessModes: [ReadWriteOnce]
  {{- if ne .Values.api.persistence.storageClass nil }}
  storageClassName: {{ .Values.api.persistence.storageClass | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.api.persistence.size | quote }}
{{- end }}
