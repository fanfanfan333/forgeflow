apiVersion: v1
kind: ConfigMap
metadata:
  name: forgeflow-config
  namespace: forgeflow
  labels:
    app.kubernetes.io/name: forgeflow
    app.kubernetes.io/part-of: forgeflow
# Non-secret runtime config. Secret values live in 11-secret.yaml.
data:
  STORAGE_BACKEND: "postgres"
  RESOURCE_STORE_ROOT: "/var/lib/forgeflow/resources"
  # --- LLM provider (local Ollama; OpenAI/Anthropic removed in INC16) ---
  LLM_PROVIDER: "ollama"
  OLLAMA_MODEL: "qwen2.5vl:3b"
  OLLAMA_MODEL_STRONG: "qwen2.5vl:3b"

  # --- Database (host is the in-cluster StatefulSet) ---
  POSTGRES_URL: "postgresql+asyncpg://forgeflow:CHANGE_ME@forgeflow-postgres:5432/forgeflow"
  POSTGRES_SYNC_URL: "postgresql+psycopg://forgeflow:CHANGE_ME@forgeflow-postgres:5432/forgeflow"

  # --- MCP server ---
  MCP_SERVER_HOST: "0.0.0.0"
  MCP_SERVER_PORT: "8001"

  # --- API ---
  API_HOST: "0.0.0.0"
  API_PORT: "8000"

  # --- Cost + resilience defaults ---
  BUDGET_LIMIT_USD: "5.0"
  MAX_RETRIES: "3"
  CIRCUIT_BREAKER_THRESHOLD: "5"

  # --- LangSmith (optional — leave blank to disable) ---
  LANGCHAIN_TRACING_V2: "false"
  LANGCHAIN_PROJECT: "forgeflow"

  # --- Approval escalation ---
  APPROVAL_ESCALATION_INTERVAL_SECONDS: "300"
  APPROVAL_FIRST_ESCALATION_MINUTES: "30"
  APPROVAL_SECOND_ESCALATION_MINUTES: "120"
  APPROVAL_AUTO_REJECT_MINUTES: "1440"

  # --- Durable queue worker (A5 slice 4) ---
  # The standalone worker Deployment (35-worker-deployment.yaml)
  # consumes the queue; the in-process worker stays off by default.
  QUEUE_WORKER_ENABLED: "false"
  QUEUE_WORKER_POLL_SECONDS: "5"
  QUEUE_WORKER_LEASE_SECONDS: "120"
  QUEUE_WORKER_BATCH_SIZE: "5"

  # --- A2A ---
  A2A_DISPATCH_ENABLED: "true"

  # --- Observability ---
  OTEL_ENABLED: "false"
  TRACING_PROVIDER: "langsmith"

  # --- Dashboard ---
  API_URL: "http://forgeflow-api:8000"
  API_PUBLIC_URL: "http://forgeflow-api:8000"
