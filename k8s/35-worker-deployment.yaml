apiVersion: apps/v1
kind: Deployment
metadata:
  name: forgeflow-worker
  namespace: forgeflow
  labels:
    app.kubernetes.io/name: forgeflow
    app.kubernetes.io/component: worker
spec:
  # Safe to scale: claiming is SKIP LOCKED + leased, so two workers
  # never execute the same queue row. Keep the API's in-process worker
  # off (QUEUE_WORKER_ENABLED=false, the default) — never run both
  # against the same queue.
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: forgeflow
      app.kubernetes.io/component: worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: forgeflow
        app.kubernetes.io/component: worker
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: worker
          # Same image as the API (the api target ships
          # scripts/run_worker.py); only the command differs. There
          # is no separate worker image to build.
          image: ghcr.io/joeljohnsonthomas/forgeflow/api:${IMAGE_TAG}  # set by CD; never :latest with IMMUTABLE ECR
          imagePullPolicy: IfNotPresent
          command: ["python", "scripts/run_worker.py"]
          # No ports, no HTTP probes: the worker serves no traffic.
          # Liveness is the heartbeat, read at GET /queue/workers
          # (stale after 3x the poll interval).
          envFrom:
            - configMapRef:
                name: forgeflow-config
            - secretRef:
                name: forgeflow-secrets
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false  # runs write temp files; tighten with emptyDir later
            capabilities:
              drop: ["ALL"]
