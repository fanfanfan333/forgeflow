name: CI

# Minimal, real gate for the parts of this repository that can be verified with
# no external service: lint + type-check, then the test suite. There is
# deliberately NO `continue-on-error` and NO `command || true` in here — a red
# analyser or a failing test must fail the build, otherwise the gate is theatre.
#
# NOT covered here, by design:
#   * tests/realstack/ — the real-stack tests need a live PostgreSQL (:5432 by
#     default; :5433 only when you apply docker-compose.override.yml) and a live
#     Ollama (:11434), and are double-gated by FORGEFLOW_REAL_STACK=1, so
#     they remain a local/operator concern. They are never faked with mocks.
#   * the evaluation-dataset workflow — "Evaluation workflow is not currently
#     configured." (there is no .github/workflows/eval.yml in this tree).
#
# STATUS: live. This workflow runs on every push to `main` and on every pull
# request against the repository's GitHub remote.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: lint + type-check + tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        # The project declares `requires-python = ">=3.11"` (a floor, not a pin);
        # 3.13 is the interpreter the pinned toolchain (ruff 0.16.10 / mypy 2.4.0)
        # is verified against, so CI uses it.
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dev toolchain
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'

      - name: Dev-environment self-check
        run: python scripts/check_dev_env.py --strict

      - name: Standard pre-commit check (make check)
        # Single gate: lint -> format-check -> typecheck -> test.
        # It fails the build on the first failing step (no `|| true`, no
        # `continue-on-error`). Real-stack tests stay out of CI by design.
        run: make check

      - name: New-debt lint ratchet (must never grow)
        # The ratchet is a "can only go down" constraint, so it belongs in the
        # gate; previously it ran only when a human remembered to invoke it, so
        # new debt could land unnoticed. Needs git (present on the runner).
        run: make lint-ratchet

      - name: Build distribution and smoke-install the wheel
        # `pip install -e .[dev]` above validates the PEP 517/660 *editable* path
        # only. Building the real wheel/sdist and installing it proves the package
        # contents + metadata are publishable. Runs LAST so the editable install
        # used by the tests is not replaced before they run.
        run: |
          python -m pip install build
          make build
          python -m pip install --force-reinstall dist/*.whl
          python -c "import forgeflow; print(forgeflow.__file__)"
          python -m pip check

  frontend:
    name: frontend lint + build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 20
        # Matches frontend/Dockerfile (node:20).
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend deps
        run: make frontend-install

      - name: Lint frontend
        run: make frontend-lint

      - name: Build frontend
        run: make frontend-build
